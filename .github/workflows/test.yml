name: Voice Action Gate Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m elyos_gate.cli fixtures/safe.jsonl --output /tmp/report.json
      - run: python -c 'import json; r=json.load(open("/tmp/report.json")); assert r["metrics"]["committed"]==2 and len(r["bookings"])==1'
